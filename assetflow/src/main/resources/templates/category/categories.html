<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Categories | AssetFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-hover: #f9fafb;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --border-hover: #d1d5db;
            --btn-primary: #111827;
            --btn-primary-hover: #374151;
            --nav-height: 64px;
            --max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.2s;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .navbar {
            height: var(--nav-height);
            background: var(--bg-body);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-main);
        }

        main {
            padding: 40px 0 80px 0;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .btn-add {
            background-color: var(--btn-primary);
            color: white;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            border-radius: 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add:hover {
            background-color: var(--btn-primary-hover);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .category-card {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.2s ease;
            position: relative;
        }

        .category-card:hover {
            border-color: var(--border-hover);
            background-color: var(--bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .cat-id {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #f3f4f6;
            padding: 2px 6px;
            border: 1px solid var(--border-color);
            border-radius: 0;
        }

        .cat-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 4px;
        }

        .cat-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            flex-grow: 1;
        }

        .card-actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .action-link {
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        .link-edit {
            color: var(--btn-primary);
        }

        .link-edit:hover {
            text-decoration: underline;
        }

        .link-delete {
            color: var(--text-secondary);
        }

        .link-delete:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a th:href="@{/}" class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                AssetFlow
            </a>
            <div class="nav-links">
                <a th:href="@{/}" class="nav-link">Dashboard</a>
                <a th:href="@{/categories}" class="nav-link active">Categories</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1 class="page-title">Categories</h1>
            <a th:href="@{/categories/create}" class="btn-add">Add Category</a>
        </header>

        <div class="category-grid">
            <div class="category-card" th:each="category : ${categoryList}">
                <div class="card-header">
                    <span class="cat-id" th:text="'ID: ' + ${category.id}">ID: 101</span>
                </div>
                <h3 class="cat-name" th:text="${category.name}">Category Name</h3>
                <p class="cat-desc" th:text="${category.description}">Category Description</p>
                <div class="card-actions">
                    <a th:href="@{/categories/{id}/edit(id=${category.id})}"
                       class="action-link link-edit">Edit</a>
					<a th:href="@{/categories/{id}/remove(id=${category.id})}"
					   class="action-link link-delete">Delete</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
