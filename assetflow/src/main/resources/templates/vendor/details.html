<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${vendor.vendorName} + ' | AssetFlow'">AssetFlow</title>>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-hover: #f9fafb;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --btn-edit-bg: #2563eb;
            --btn-edit-hover: #1d4ed8;
            --btn-delete-bg: #dc2626;
            --btn-delete-hover: #b91c1c;
            --nav-height: 64px;
            --max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.2s;
        }

        button {
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .navbar {
            height: var(--nav-height);
            background: var(--bg-body);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        main {
            padding: 40px 0 80px 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: -0.02em;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .details-grid {
                grid-template-columns: 320px 1fr;
            }
        }

        .card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 32px;
            height: fit-content;
        }

        .profile-card {
            text-align: center;
        }

        .profile-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 0 0 1px var(--border-color);
            background-color: #f3f4f6;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vendor-name-display {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .vendor-id {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: block;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #f0fdf4;
            color: #15803d;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #bbf7d0;
            border-radius: 0;
        }

        .info-header {
            font-size: 1.1rem;
            font-weight: 600;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            color: var(--text-main);
            flex-shrink: 0;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #f3f4f6;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            border-radius: 0;
            text-transform: capitalize;
        }

        .actions-wrapper {
            margin-top: 32px;
            display: flex;
            gap: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 0;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-edit {
            background: var(--btn-edit-bg);
            color: white;
        }

        .btn-edit:hover {
            opacity: 0.9;
        }

        .btn-delete {
            background: var(--btn-delete-bg);
            color: white;
        }

        .btn-delete:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a th:href="@{/}" class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                AssetFlow
            </a>
            <div class="nav-links">
                <a th:href="@{/}" class="nav-link active">Dashboard</a>
                <a th:href="@{/categories}" class="nav-link">Categories</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <div>
                <a th:href="@{/}" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Dashboard
                </a>
                <h1 class="page-title" th:text="${vendor.vendorName}">Vendor Name</h1>
            </div>

            <div class="details-grid">
                <div class="card profile-card">
                    <div class="profile-wrapper">
                        <img th:src="${vendor.photosImagePath != null ? vendor.photosImagePath : '/images/default.png'}" alt="Vendor Logo" class="profile-img">
                    </div>
                    <div class="vendor-name-display" th:text="${vendor.vendorName}">Vendor Name</div>
                    <span class="vendor-id">ID: <span th:text="${vendor.id}">--</span></span>
                    <div class="status-indicator">
                        <span style="width: 8px; height: 8px; background: #15803d; border-radius: 50%;"></span>
                        Active Partner
                    </div>
                </div>

                <div class="card">
                    <div class="info-header">Vendor Information</div>

                    <div class="info-row">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <div class="info-content">
                            <span class="info-label">Vendor Name</span>
                            <div class="info-value" th:text="${vendor.vendorName}">--</div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                                <polyline points="2 17 12 22 22 17"></polyline>
                                <polyline points="2 12 12 17 22 12"></polyline>
                            </svg>
                        </div>
                        <div class="info-content">
                            <span class="info-label">Category</span>
                            <div class="info-value">
                                <span class="badge" th:text="${vendor.category.name}">--</span>
                            </div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <div class="info-content">
                            <span class="info-label">Business Email</span>
                            <div class="info-value" th:text="${vendor.email}">--</div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </div>
                        <div class="info-content">
                            <span class="info-label">Contact Number</span>
                            <div class="info-value" th:text="${vendor.phone}">--</div>
                        </div>
                    </div>

                    <div class="actions-wrapper">
                        <a th:href="@{/vendor/{id}/edit(id=${vendor.id})}" class="btn btn-edit">Edit Vendor</a>
                        <a th:href="@{/vendor/{id}/delete(id=${vendor.id})}" class="btn btn-delete">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
